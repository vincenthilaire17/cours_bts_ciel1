<style>
@page {
    margin: 1.5cm;
    size: A4;
}
body {
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.5;
    color: #1a1a1a;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px;
}
h1, h2, h3, h4 {
    color: #0b3c5d;
}
h1 {
    font-size: 20pt;
    border-bottom: 2px solid #0b3c5d;
    padding-bottom: 6px;
    margin-bottom: 12px;
}
h2 {
    font-size: 15pt;
    margin-top: 18px;
    margin-bottom: 8px;
}
h3 {
    font-size: 12pt;
    margin-top: 14px;
    border-left: 4px solid #328cc1;
    padding-left: 8px;
}
table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
    font-size: 10pt;
}
th, td {
    border: 1px solid #c9d1d9;
    padding: 7px 10px;

}
th {

    color: #0b3c5d;
}
tr:nth-child(even) {

}
pre {
    background-color: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 10px;
    font-size: 9.5pt;
    line-height: 1.4;
    overflow-x: auto;
    font-family: Consolas, 'Courier New', monospace;
}
code {
    background-color: #f0f2f5;
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 9.5pt;

}
