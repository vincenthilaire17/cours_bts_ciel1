<svg viewBox="0 0 940 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brochage complet de l'Arduino Nano V3 ATmega328P">
  <defs>
    <style>
      .t-bold { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; }
      .t-mono { font-family: 'Consolas', 'Courier New', monospace; }
      .t-sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      .pin-box { rx: 4px; ry: 4px; stroke-width: 1; }
    </style>
  </defs>
  
  <rect width="940" height="450" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <text x="470" y="32" class="t-bold" font-size="16" fill="#0b3c5d" text-anchor="middle">Arduino Nano v3.0 — Brochage Complet &amp; Fonctions Spéciales (ATmega328P / 5 V)</text>
  <text x="470" y="50" class="t-sans" font-size="11" fill="#64748b" text-anchor="middle">Architecture AVR 8 bits @ 16 MHz • 32 Ko Flash • 2 Ko SRAM • Logique 5 V TTL</text>

  <!-- CARTE ARDUINO NANO (CENTRE) -->
  <g id="nano-board" transform="translate(365, 65)">
    <rect x="0" y="0" width="210" height="350" rx="10" fill="#00979d" stroke="#006468" stroke-width="2.5"/>
    <rect x="8" y="8" width="194" height="334" rx="8" fill="#008388"/>
    
    <!-- Connecteur Mini-USB haut -->
    <rect x="70" y="-8" width="70" height="30" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="80" y="2" width="50" height="14" rx="2" fill="#1e293b"/>
    <text x="105" y="13" class="t-mono" font-size="8.5" fill="#f8fafc" text-anchor="middle">Mini-USB</text>

    <!-- Circuit USB-UART -->
    <rect x="80" y="35" width="50" height="26" rx="2" fill="#1e293b" stroke="#334155"/>
    <text x="105" y="51" class="t-mono" font-size="7.5" fill="#cbd5e1" text-anchor="middle">USB-UART</text>

    <!-- Puce principale ATmega328P TQFP-32 -->
    <g transform="translate(75, 155) rotate(45)">
      <rect x="-35" y="-35" width="70" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="-25" cy="-25" r="3" fill="#64748b"/>
      <text x="0" y="-4" class="t-mono t-bold" font-size="9" fill="#f8fafc" text-anchor="middle">ATmega</text>
      <text x="0" y="9" class="t-mono t-bold" font-size="9" fill="#fde047" text-anchor="middle">328P</text>
      <text x="0" y="20" class="t-mono" font-size="7" fill="#94a3b8" text-anchor="middle">16 MHz</text>
    </g>

    <!-- Bouton Reset central -->
    <circle cx="105" cy="85" r="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="105" cy="85" r="5" fill="#ef4444"/>
    <text x="105" y="105" class="t-mono" font-size="7" fill="#f8fafc" text-anchor="middle">RESET</text>

    <!-- Quartz 16 MHz -->
    <rect x="90" y="245" width="30" height="15" rx="3" fill="#cbd5e1" stroke="#64748b"/>
    <text x="105" y="256" class="t-mono" font-size="6.5" fill="#1e293b" text-anchor="middle">16 MHz</text>

    <!-- LEDs d'état intégrées -->
    <g transform="translate(30, 115)">
      <rect x="0" y="0" width="8" height="5" fill="#22c55e"/><text x="12" y="5" class="t-mono" font-size="6.5" fill="#f8fafc">PWR</text>
      <rect x="0" y="12" width="8" height="5" fill="#eab308"/><text x="12" y="17" class="t-mono" font-size="6.5" fill="#f8fafc">L (D13)</text>
      <rect x="0" y="24" width="8" height="5" fill="#38bdf8"/><text x="12" y="29" class="t-mono" font-size="6.5" fill="#f8fafc">TX</text>
      <rect x="0" y="36" width="8" height="5" fill="#38bdf8"/><text x="12" y="41" class="t-mono" font-size="6.5" fill="#f8fafc">RX</text>
    </g>

    <!-- Broches Gauche (1 à 15) -->
    <g id="header-pins-left">
      <circle cx="10" cy="30" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="50" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="70" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="90" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="110" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="130" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="150" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="170" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="190" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="210" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="230" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="250" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="270" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="290" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="10" cy="310" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
    </g>

    <!-- Broches Droite (16 à 30) -->
    <g id="header-pins-right">
      <circle cx="200" cy="30" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="50" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="70" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="90" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="110" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="130" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="150" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="170" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="190" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="210" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="230" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="250" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="270" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="290" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="200" cy="310" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1.2"/>
    </g>
  </g>

  <!-- LABELS GAUCHE -->
  <g transform="translate(20, 65)">
    <rect x="0" y="21" width="335" height="18" fill="#f1f5f9" stroke="#cbd5e1" class="pin-box"/>
    <text x="325" y="34" class="t-mono t-bold" font-size="10" fill="#0f172a" text-anchor="end">D1 / TX [Pin 1]</text>
    <rect x="180" y="23" width="55" height="14" rx="3" fill="#e0e7ff"/><text x="207" y="34" class="t-sans" font-size="8.5" fill="#3730a3" text-anchor="middle">UART TX</text>

    <rect x="0" y="41" width="335" height="18" fill="#f1f5f9" stroke="#cbd5e1" class="pin-box"/>
    <text x="325" y="54" class="t-mono t-bold" font-size="10" fill="#0f172a" text-anchor="end">D0 / RX [Pin 2]</text>
    <rect x="180" y="43" width="55" height="14" rx="3" fill="#e0e7ff"/><text x="207" y="54" class="t-sans" font-size="8.5" fill="#3730a3" text-anchor="middle">UART RX</text>

    <rect x="0" y="61" width="335" height="18" fill="#fef2f2" stroke="#fecaca" class="pin-box"/>
    <text x="325" y="74" class="t-mono t-bold" font-size="10" fill="#b91c1c" text-anchor="end">/RESET [Pin 3]</text>
    <text x="210" y="74" class="t-sans" font-size="8.5" fill="#dc2626">Reset actif bas</text>

    <rect x="0" y="81" width="335" height="18" fill="#f8fafc" stroke="#94a3b8" class="pin-box"/>
    <text x="325" y="94" class="t-mono t-bold" font-size="10" fill="#1e293b" text-anchor="end">GND [Pin 4]</text>
    <rect x="195" y="83" width="45" height="14" rx="3" fill="#334155"/><text x="217" y="94" class="t-sans" font-size="8.5" fill="#ffffff" text-anchor="middle">0 V</text>

    <rect x="0" y="101" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="114" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">D2 (INT0) [Pin 5]</text>
    <rect x="150" y="103" width="85" height="14" rx="3" fill="#dbeafe"/><text x="192" y="114" class="t-bold" font-size="8.5" fill="#1e40af" text-anchor="middle">Relais (Port D2)</text>

    <rect x="0" y="121" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="134" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">~ D3 (INT1/PWM) [Pin 6]</text>
    <rect x="180" y="123" width="50" height="14" rx="3" fill="#fef3c7"/><text x="205" y="134" class="t-sans t-bold" font-size="8.5" fill="#b45309" text-anchor="middle">~ PWM 490Hz</text>

    <rect x="0" y="141" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="154" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">D4 [Pin 7]</text>
    <text x="185" y="154" class="t-sans" font-size="8.5" fill="#475569">GPIO (Port Grove D4)</text>

    <rect x="0" y="161" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="174" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">~ D5 (PWM) [Pin 8]</text>
    <rect x="180" y="163" width="50" height="14" rx="3" fill="#fef3c7"/><text x="205" y="174" class="t-sans t-bold" font-size="8.5" fill="#b45309" text-anchor="middle">~ PWM 980Hz</text>

    <rect x="0" y="181" width="335" height="18" fill="#f0fdf4" stroke="#bbf7d0" class="pin-box"/>
    <text x="325" y="194" class="t-mono t-bold" font-size="10" fill="#15803d" text-anchor="end">~ D6 (PWM) [Pin 9]</text>
    <rect x="135" y="183" width="105" height="14" rx="3" fill="#dcfce7"/><text x="187" y="194" class="t-bold" font-size="8.5" fill="#166534" text-anchor="middle">LED Bar DATA (Port D6)</text>

    <rect x="0" y="201" width="335" height="18" fill="#f0fdf4" stroke="#bbf7d0" class="pin-box"/>
    <text x="325" y="214" class="t-mono t-bold" font-size="10" fill="#15803d" text-anchor="end">D7 [Pin 10]</text>
    <rect x="135" y="203" width="105" height="14" rx="3" fill="#dcfce7"/><text x="187" y="214" class="t-bold" font-size="8.5" fill="#166534" text-anchor="middle">LED Bar CLK (Port D6)</text>

    <rect x="0" y="221" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="234" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">D8 [Pin 11]</text>
    <text x="200" y="234" class="t-sans" font-size="8.5" fill="#475569">GPIO / ICP1</text>

    <rect x="0" y="241" width="335" height="18" fill="#fef2f2" stroke="#fecaca" class="pin-box"/>
    <text x="325" y="254" class="t-mono t-bold" font-size="10" fill="#b91c1c" text-anchor="end">~ D9 (PWM) [Pin 12]</text>
    <rect x="145" y="243" width="95" height="14" rx="3" fill="#fee2e2"/><text x="192" y="254" class="t-bold" font-size="8.5" fill="#991b1b" text-anchor="middle">PWM TIP31C Moteur</text>

    <rect x="0" y="261" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="274" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">~ D10 (PWM/SS) [Pin 13]</text>
    <text x="210" y="274" class="t-sans" font-size="8.5" fill="#475569">SPI SS / ~PWM</text>

    <rect x="0" y="281" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="294" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">~ D11 (MOSI) [Pin 14]</text>
    <text x="210" y="294" class="t-sans" font-size="8.5" fill="#475569">SPI MOSI / ~PWM</text>

    <rect x="0" y="301" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="325" y="314" class="t-mono t-bold" font-size="10" fill="#1d4ed8" text-anchor="end">D12 (MISO) [Pin 15]</text>
    <text x="230" y="314" class="t-sans" font-size="8.5" fill="#475569">SPI MISO</text>
  </g>

  <!-- LABELS DROITE -->
  <g transform="translate(585, 65)">
    <rect x="0" y="21" width="335" height="18" fill="#fef2f2" stroke="#fecaca" class="pin-box"/>
    <text x="10" y="34" class="t-mono t-bold" font-size="10" fill="#b91c1c">[Pin 30] VIN (7-12 V)</text>
    <text x="170" y="34" class="t-sans" font-size="8.5" fill="#dc2626">Entrée régulateur interne</text>

    <rect x="0" y="41" width="335" height="18" fill="#f8fafc" stroke="#94a3b8" class="pin-box"/>
    <text x="10" y="54" class="t-mono t-bold" font-size="10" fill="#1e293b">[Pin 29] GND</text>
    <rect x="150" y="43" width="45" height="14" rx="3" fill="#334155"/><text x="172" y="54" class="t-sans" font-size="8.5" fill="#ffffff" text-anchor="middle">0 V</text>

    <rect x="0" y="61" width="335" height="18" fill="#fef2f2" stroke="#fecaca" class="pin-box"/>
    <text x="10" y="74" class="t-mono t-bold" font-size="10" fill="#b91c1c">[Pin 28] /RESET</text>
    <text x="150" y="74" class="t-sans" font-size="8.5" fill="#dc2626">Reset actif bas</text>

    <rect x="0" y="81" width="335" height="18" fill="#fef2f2" stroke="#fca5a5" class="pin-box"/>
    <text x="10" y="94" class="t-mono t-bold" font-size="10" fill="#dc2626">[Pin 27] +5V (VCC)</text>
    <rect x="135" y="83" width="70" height="14" rx="3" fill="#dc2626"/><text x="170" y="94" class="t-bold" font-size="8.5" fill="#ffffff" text-anchor="middle">Alim Logique 5V</text>

    <rect x="0" y="101" width="335" height="18" fill="#fffbeb" stroke="#fde68a" class="pin-box"/>
    <text x="10" y="114" class="t-mono t-bold" font-size="10" fill="#b45309">[Pin 26] A7 (CAN pur)</text>
    <text x="150" y="114" class="t-sans" font-size="8.5" fill="#92400e">Port A6 (Pin 2)</text>

    <rect x="0" y="121" width="335" height="18" fill="#fffbeb" stroke="#fde68a" class="pin-box"/>
    <text x="10" y="134" class="t-mono t-bold" font-size="10" fill="#b45309">[Pin 25] A6 (CAN pur)</text>
    <text x="150" y="134" class="t-sans" font-size="8.5" fill="#92400e">Port Grove A6</text>

    <rect x="0" y="141" width="335" height="18" fill="#f5f3ff" stroke="#ddd6fe" class="pin-box"/>
    <text x="10" y="154" class="t-mono t-bold" font-size="10" fill="#6d28d9">[Pin 24] A5 / SCL</text>
    <text x="145" y="154" class="t-sans" font-size="8.5" fill="#5b21b6">I2C SCL (Horloge)</text>

    <rect x="0" y="161" width="335" height="18" fill="#f5f3ff" stroke="#ddd6fe" class="pin-box"/>
    <text x="10" y="174" class="t-mono t-bold" font-size="10" fill="#6d28d9">[Pin 23] A4 / SDA</text>
    <text x="145" y="174" class="t-sans" font-size="8.5" fill="#5b21b6">I2C SDA (Données)</text>

    <rect x="0" y="181" width="335" height="18" fill="#fffbeb" stroke="#fde68a" class="pin-box"/>
    <text x="10" y="194" class="t-mono t-bold" font-size="10" fill="#b45309">[Pin 22] A3</text>
    <text x="150" y="194" class="t-sans" font-size="8.5" fill="#92400e">Port A2 (Pin 2)</text>

    <rect x="0" y="201" width="335" height="18" fill="#fffbeb" stroke="#fde68a" class="pin-box"/>
    <text x="10" y="214" class="t-mono t-bold" font-size="10" fill="#b45309">[Pin 21] A2</text>
    <text x="150" y="214" class="t-sans" font-size="8.5" fill="#92400e">Port Grove A2</text>

    <rect x="0" y="221" width="335" height="18" fill="#fffbeb" stroke="#fde68a" class="pin-box"/>
    <text x="10" y="234" class="t-mono t-bold" font-size="10" fill="#b45309">[Pin 20] A1</text>
    <text x="150" y="234" class="t-sans" font-size="8.5" fill="#92400e">Port A0 (Pin 2)</text>

    <rect x="0" y="241" width="335" height="18" fill="#fffbeb" stroke="#f59e0b" class="pin-box" stroke-width="1.8"/>
    <text x="10" y="254" class="t-mono t-bold" font-size="10" fill="#b45309">[Pin 19] A0 (CAN 10b)</text>
    <rect x="135" y="243" width="125" height="14" rx="3" fill="#fef3c7"/><text x="197" y="254" class="t-bold" font-size="8.5" fill="#92400e" text-anchor="middle">Potentiomètre Grove (A0)</text>

    <rect x="0" y="261" width="335" height="18" fill="#f8fafc" stroke="#cbd5e1" class="pin-box"/>
    <text x="10" y="274" class="t-mono t-bold" font-size="10" fill="#475569">[Pin 18] AREF</text>
    <text x="145" y="274" class="t-sans" font-size="8.5" fill="#64748b">Réf externe CAN</text>

    <rect x="0" y="281" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="10" y="294" class="t-mono t-bold" font-size="10" fill="#0284c7">[Pin 17] 3V3</text>
    <text x="145" y="294" class="t-sans" font-size="8.5" fill="#0369a1">Sortie 3,3 V (max 50mA)</text>

    <rect x="0" y="301" width="335" height="18" fill="#eff6ff" stroke="#bfdbfe" class="pin-box"/>
    <text x="10" y="314" class="t-mono t-bold" font-size="10" fill="#1d4ed8">[Pin 16] D13 (SCK/LED L)</text>
    <text x="165" y="314" class="t-sans" font-size="8.5" fill="#475569">SPI SCK • LED intégrée</text>
  </g>

  <!-- LÉGENDE -->
  <g transform="translate(60, 415)">
    <rect x="0" y="0" width="18" height="14" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="26" y="11" class="t-sans" font-size="9.5" fill="#1e3a8a">Numérique / GPIO</text>

    <rect x="150" y="0" width="18" height="14" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="176" y="11" class="t-sans" font-size="9.5" fill="#78350f">PWM matériel (~)</text>

    <rect x="300" y="0" width="18" height="14" rx="3" fill="#fffbeb" stroke="#fde68a"/>
    <text x="326" y="11" class="t-sans" font-size="9.5" fill="#92400e">Analogique CAN 10 bits</text>

    <rect x="495" y="0" width="18" height="14" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="521" y="11" class="t-sans" font-size="9.5" fill="#991b1b">Alimentation / Puissance</text>

    <rect x="685" y="0" width="18" height="14" rx="3" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="711" y="11" class="t-sans" font-size="9.5" fill="#5b21b6">Bus Com (UART, I2C, SPI)</text>
  </g>
</svg>
