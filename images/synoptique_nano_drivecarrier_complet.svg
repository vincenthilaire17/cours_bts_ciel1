<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Synoptique global du système NANO-DRIVECARRIER avec Arduino Nano Connector Carrier">
  <defs>
    <style>
      .t-bold { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; }
      .t-mono { font-family: 'Consolas', 'Courier New', monospace; }
      .t-sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="940" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Titre -->
  <text x="470" y="28" class="t-bold" font-size="15" fill="#0b3c5d" text-anchor="middle">Architecture Matérielle « NANO-DRIVECARRIER » — Arduino Nano Connector Carrier (ASX00051)</text>
  <text x="470" y="46" class="t-sans" font-size="10.5" fill="#64748b" text-anchor="middle">Potentiomètre sur Grove J7 (A0) • Switch réglé sur 5V • LED Bar sur D6/D7 • Relais D2 &amp; Hacheur PWM TIP31C D9</text>

  <!-- ZONE 1 : ENTRÉES / IHM (GAUCHE) -->
  <g transform="translate(20, 65)">
    <rect x="0" y="0" width="210" height="295" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="28" rx="8" fill="#f1f5f9"/>
    <text x="105" y="19" class="t-bold" font-size="11" fill="#0b3c5d" text-anchor="middle">IHM &amp; Acquisition (5 V)</text>

    <!-- Potentiomètre Grove -->
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="180" height="110" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="90" y="20" class="t-bold" font-size="10" fill="#b45309" text-anchor="middle">Potentiomètre Grove (10 k&Omega;)</text>
      <circle cx="45" cy="58" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="45" y1="58" x2="60" y2="45" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
      <text x="125" y="50" class="t-sans" font-size="8.5" fill="#7c2d12">Tension 0 à 5 V</text>
      <text x="125" y="64" class="t-mono t-bold" font-size="9" fill="#b45309">CAN 10 bits</text>
      <text x="125" y="78" class="t-sans" font-size="8" fill="#9a3412">0 à 1023 pts</text>
      <rect x="10" y="88" width="160" height="14" rx="3" fill="#fef3c7"/>
      <text x="90" y="99" class="t-bold" font-size="8" fill="#78350f" text-anchor="middle">Connecté sur Port Grove J7 (A0)</text>
    </g>

    <!-- Témoin LED d'état -->
    <g transform="translate(15, 160)">
      <rect x="0" y="0" width="180" height="115" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="90" y="20" class="t-bold" font-size="10" fill="#15803d" text-anchor="middle">Voyants &amp; Signalisation</text>
      <circle cx="35" cy="48" r="10" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
      <text x="55" y="52" class="t-sans" font-size="8.5" fill="#14532d">LED Marche (Broche D4)</text>

      <circle cx="35" cy="80" r="10" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="55" y="84" class="t-sans" font-size="8.5" fill="#7f1d1d">LED Arrêt / Sécurité</text>

      <text x="90" y="105" class="t-sans" font-size="7.5" fill="#475569" text-anchor="middle">Résistances de limitation 330 &Omega;</text>
    </g>
  </g>

  <!-- LIAISONS IHM -> CARRIER -->
  <line x1="230" y1="160" x2="270" y2="160" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="270,160 262,155 262,165" fill="#f59e0b"/>
  <text x="250" y="152" class="t-mono t-bold" font-size="8" fill="#b45309" text-anchor="middle">J7:A0</text>

  <!-- ZONE 2 : CŒUR DE TRAITEMENT (NANO + NANO CONNECTOR CARRIER) -->
  <g transform="translate(270, 65)">
    <rect x="0" y="0" width="235" height="295" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="235" height="30" rx="8" fill="#1e293b"/>
    <text x="117" y="20" class="t-bold" font-size="10.5" fill="#38bdf8" text-anchor="middle">Nano Connector Carrier (ASX00051)</text>

    <!-- Switch 5V / 3V3 mis en évidence -->
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="205" height="28" rx="4" fill="#00979d" stroke="#006468"/>
      <text x="10" y="18" class="t-mono t-bold" font-size="8.5" fill="#ffffff">SWITCH ALIM :</text>
      <rect x="90" y="4" width="48" height="20" rx="3" fill="#ffffff"/>
      <text x="114" y="18" class="t-mono t-bold" font-size="9" fill="#b91c1c" text-anchor="middle">[ 5V ]</text>
      <text x="155" y="18" class="t-sans" font-size="8" fill="#e0f2fe">3V3</text>
    </g>

    <!-- Représentation PCB Nano sur Carrier -->
    <rect x="15" y="74" width="205" height="135" rx="5" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="117" y="92" class="t-bold" font-size="10.5" fill="#5eead4" text-anchor="middle">ARDUINO NANO v3</text>
    <text x="117" y="106" class="t-sans" font-size="8" fill="#fde047" text-anchor="middle">ATmega328P @ 16 MHz (Logique 5 V)</text>

    <!-- Fonctions logicielles dans la puce -->
    <rect x="25" y="112" width="185" height="88" rx="4" fill="#0f172a"/>
    <text x="117" y="126" class="t-mono t-bold" font-size="8" fill="#38bdf8" text-anchor="middle">FONCTIONS C++ DU TP :</text>
    <text x="32" y="140" class="t-mono" font-size="7.5" fill="#e0f2fe">1. lireConsignePotentiometre(A0)</text>
    <text x="32" y="153" class="t-mono" font-size="7.5" fill="#e0f2fe">2. actualiserLedBar(niveau)</text>
    <text x="32" y="166" class="t-mono" font-size="7.5" fill="#e0f2fe">3. commanderEtagePuissance()</text>
    <text x="32" y="179" class="t-mono" font-size="7.5" fill="#e0f2fe">4. envoyerTelemetrieSerie()</text>

    <!-- Connecteurs Carrier en bas -->
    <g transform="translate(15, 218)">
      <rect x="0" y="0" width="205" height="65" rx="5" fill="#1e293b" stroke="#475569"/>
      <text x="102" y="16" class="t-bold" font-size="8.5" fill="#4ade80" text-anchor="middle">Connecteurs &amp; Headers du Carrier :</text>
      <text x="102" y="32" class="t-mono" font-size="8" fill="#f8fafc" text-anchor="middle">• Grove J7 : A0 (Potar 10k)</text>
      <text x="102" y="46" class="t-mono" font-size="8" fill="#f8fafc" text-anchor="middle">• Header JP2 : D2 (Relais) | D9 (PWM)</text>
      <text x="102" y="58" class="t-mono" font-size="8" fill="#fde047" text-anchor="middle">• Header JP2 : D6 (Data) &amp; D7 (Clock)</text>
    </g>
  </g>

  <!-- LIAISON VERS LED BAR (HAUT) -->
  <line x1="390" y1="65" x2="390" y2="48" stroke="#10b981" stroke-width="2"/>
  <line x1="390" y1="48" x2="710" y2="48" stroke="#10b981" stroke-width="2"/>
  <line x1="710" y1="48" x2="710" y2="65" stroke="#10b981" stroke-width="2"/>
  <polygon points="710,65 706,57 714,57" fill="#10b981"/>

  <!-- ZONE 3 : GROVE LED BAR (HAUT DROITE) -->
  <g transform="translate(540, 65)">
    <rect x="0" y="0" width="375" height="85" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="187" y="18" class="t-bold" font-size="10.5" fill="#4ade80" text-anchor="middle">Grove - LED Bar (Afficheur Dynamique 10 Segments)</text>
    
    <!-- Représentation mini des 10 leds -->
    <g transform="translate(25, 28)">
      <rect x="0" y="0" width="325" height="22" rx="3" fill="#0f172a"/>
      <rect x="6" y="4" width="26" height="14" fill="#ef4444" rx="2"/>
      <rect x="38" y="4" width="26" height="14" fill="#f97316" rx="2"/>
      <rect x="70" y="4" width="26" height="14" fill="#eab308" rx="2"/>
      <rect x="102" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
      <rect x="134" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
      <rect x="166" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
      <rect x="198" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
      <rect x="230" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
      <rect x="262" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
      <rect x="294" y="4" width="26" height="14" fill="#22c55e" rx="2"/>
    </g>
    <text x="187" y="66" class="t-sans" font-size="8" fill="#cbd5e1" text-anchor="middle">Niveau 0 (Éteint) à Niveau 10 (Plein Régime) — Piloté par driver MY9221</text>
    <text x="187" y="78" class="t-mono t-bold" font-size="8" fill="#86efac" text-anchor="middle">Clock ➜ Broche D7 (JP2:10)  •  Data ➜ Broche D6 (JP2:9)</text>
  </g>

  <!-- LIAISONS VERS PUISSANCE -->
  <!-- D2 vers Relais -->
  <line x1="505" y1="205" x2="540" y2="205" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="540,205 532,200 532,210" fill="#1d4ed8"/>
  <text x="522" y="198" class="t-mono t-bold" font-size="8.5" fill="#1d4ed8" text-anchor="middle">D2</text>

  <!-- D9 vers Transistor PWM -->
  <line x1="505" y1="295" x2="540" y2="295" stroke="#b91c1c" stroke-width="2.5"/>
  <polygon points="540,295 532,290 532,300" fill="#b91c1c"/>
  <text x="522" y="288" class="t-mono t-bold" font-size="8.5" fill="#b91c1c" text-anchor="middle">~D9</text>

  <!-- ZONE 4 : CHAÎNE DE PUISSANCE HYBRIDE (BAS DROITE) -->
  <g transform="translate(540, 165)">
    <rect x="0" y="0" width="375" height="195" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.8"/>
    <rect x="0" y="0" width="375" height="24" rx="8" fill="#fee2e2"/>
    <text x="187" y="16" class="t-bold" font-size="11" fill="#991b1b" text-anchor="middle">Chaîne de Puissance (Powerbank Varta 5 V)</text>

    <!-- Relais Grove -->
    <g transform="translate(15, 35)">
      <rect x="0" y="0" width="150" height="65" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="75" y="18" class="t-bold" font-size="9.5" fill="#166534" text-anchor="middle">1. Relais Grove (Broche D2)</text>
      <text x="75" y="32" class="t-sans" font-size="8" fill="#334155">Contact NO en série sur le +5V</text>
      <text x="75" y="46" class="t-bold" font-size="7.5" fill="#15803d">Isolation Galvanique / Sécu</text>
      <text x="75" y="58" class="t-mono" font-size="7.5" fill="#475569">Commandé par D2 (JP2:5)</text>
    </g>

    <!-- Transistor TIP31C PWM -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="150" height="72" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="75" y="18" class="t-bold" font-size="9.5" fill="#b91c1c" text-anchor="middle">2. Transistor TIP31C (D9)</text>
      <text x="75" y="32" class="t-mono" font-size="8" fill="#334155">R_B = 330 &Omega; • 1N4001</text>
      <text x="75" y="46" class="t-bold" font-size="8" fill="#991b1b">Hacheur PWM 490 Hz (0–255)</text>
      <text x="75" y="60" class="t-sans" font-size="7.5" fill="#475569">Masse GND commune avec Nano</text>
    </g>

    <!-- Moteur CC 3-6V -->
    <g transform="translate(240, 50)">
      <circle cx="50" cy="50" r="32" fill="#fef08a" stroke="#ca8a04" stroke-width="2.5"/>
      <text x="50" y="46" class="t-bold" font-size="12" fill="#854d0e" text-anchor="middle">MOTEUR</text>
      <text x="50" y="60" class="t-bold" font-size="10" fill="#854d0e" text-anchor="middle">CC 3–6 V</text>
      <line x1="-30" y1="20" x2="18" y2="35" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="18" y1="65" x2="-30" y2="80" stroke="#1e293b" stroke-width="2.5"/>
      <text x="50" y="110" class="t-sans" font-size="8" fill="#475569" text-anchor="middle">Diode roue libre 1N4001</text>
    </g>
  </g>
</svg>
